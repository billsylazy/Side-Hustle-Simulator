<html><head><meta charset="utf-8"><title>map render</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1280, H = 720;
const data = await (await fetch('./map.json?' + Date.now())).json();
const views = await (await fetch('./views.json?' + Date.now())).json();

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05 + (data.lighting.exposure || 0) * 0.5;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const c3 = (a) => new THREE.Color().setRGB(a[0], a[1], a[2], THREE.SRGBColorSpace);

// ---- sky + fog (Roblox Atmosphere approximation) ----
const atm = data.atmosphere || { density: 0.3, c: [0.78, 0.86, 1], haze: 1 };
const horizon = c3(atm.c).lerp(new THREE.Color(1, 1, 1), 0.25);
{
  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 512;
  const g = cv.getContext('2d'); const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, '#3f8ff0'); grd.addColorStop(0.55, '#8cc3ff'); grd.addColorStop(0.75, '#' + horizon.getHexString()); grd.addColorStop(1, '#' + horizon.getHexString());
  g.fillStyle = grd; g.fillRect(0, 0, 4, 512);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; scene.background = tex;
}
const fogFar = 1400 - atm.density * 1500;
scene.fog = new THREE.Fog(horizon, Math.max(120, fogFar * 0.25), Math.max(500, fogFar));

// ---- lights ----
const L = data.lighting;
const clock = L.clock ?? 13;
const sunAngle = ((clock - 6) / 12) * Math.PI; // 6h rise .. 18h set
const sunDir = new THREE.Vector3(Math.cos(sunAngle) * 0.8, Math.sin(sunAngle) * 1.0 + 0.15, 0.45).normalize();
const sunWarm = clock < 8 || clock > 16.5 ? new THREE.Color(1.0, 0.72, 0.45) : new THREE.Color(1.0, 0.96, 0.88);
const sun = new THREE.DirectionalLight(sunWarm, 2.2 * (L.brightness / 2.6));
sun.position.copy(sunDir.clone().multiplyScalar(600)); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096); const sc = sun.shadow.camera;
sc.left = -420; sc.right = 420; sc.top = 420; sc.bottom = -420; sc.near = 10; sc.far = 1600; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun); scene.add(sun.target);
scene.add(new THREE.HemisphereLight(c3(L.outdoor).lerp(new THREE.Color(0.6, 0.75, 1), 0.4), c3(L.ambient).multiplyScalar(0.6), 0.9));
scene.add(new THREE.AmbientLight(c3(L.ambient), 0.35));

// ---- materials ----
const matCache = new Map();
function noiseTex(seed) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  const img = g.createImageData(128, 128); let s = seed;
  for (let i = 0; i < img.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = 215 + (s % 40); img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 40); return t;
}
const grassNoise = noiseTex(12345);
function material(m, c, t) {
  const key = m + c.join(',') + t;
  if (matCache.has(key)) return matCache.get(key);
  const color = c3(c); let mat;
  const opacity = 1 - t;
  if (m === 'Neon') {
    mat = new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(1.7), toneMapped: false });
  } else if (m === 'Glass') {
    mat = new THREE.MeshStandardMaterial({ color, roughness: 0.08, metalness: 0.35, transparent: true, opacity: Math.min(0.75, Math.max(0.25, opacity)) });
  } else if (m === 'ForceField') {
    mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.25, depthWrite: false });
  } else {
    const rough = { SmoothPlastic: 0.45, Plastic: 0.6, Metal: 0.35, DiamondPlate: 0.4, Marble: 0.25, Wood: 0.85, WoodPlanks: 0.85, Fabric: 1, Grass: 1, Concrete: 0.95, Cobblestone: 0.95, Brick: 0.95, Pavement: 0.95, Asphalt: 0.95, Slate: 0.9, Sand: 1, Ice: 0.1, Foil: 0.3 }[m] ?? 0.6;
    const metal = (m === 'Metal' || m === 'DiamondPlate' || m === 'Foil') ? 0.55 : 0;
    mat = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
    if (opacity < 1) { mat.transparent = true; mat.opacity = opacity; mat.depthWrite = opacity > 0.6; }
  }
  matCache.set(key, mat); return mat;
}

// ---- geometry ----
function wedgeGeom(w, h, d) {
  const x0 = -w / 2, x1 = w / 2, y0 = -h / 2, y1 = h / 2, z0 = -d / 2, z1 = d / 2;
  // profile: A bottom-front (y0,z0), B bottom-back (y0,z1), C top-back (y1,z1)
  const A0 = [x0, y0, z0], B0 = [x0, y0, z1], C0 = [x0, y1, z1], A1 = [x1, y0, z0], B1 = [x1, y0, z1], C1 = [x1, y1, z1];
  const tris = [A0, C0, B0, A1, B1, C1, A0, B0, B1, A0, B1, A1, B0, C0, C1, B0, C1, B1, A0, A1, C1, A0, C1, C0];
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(tris.flat(), 3)); g.computeVertexNormals(); return g;
}
function partMesh(p) {
  if (p.t >= 0.98) return null;
  const [sx, sy, sz] = p.z; let geom;
  if (p.s === 'Ball') { const r = Math.min(sx, sy, sz) / 2; geom = new THREE.SphereGeometry(r, 28, 18); }
  else if (p.s === 'Cylinder') { const r = Math.min(sy, sz) / 2; geom = new THREE.CylinderGeometry(r, r, sx, 28); geom.rotateZ(Math.PI / 2); }
  else if (p.s === 'Wedge' || p.s === 'CornerWedge') geom = wedgeGeom(sx, sy, sz);
  else geom = new THREE.BoxGeometry(sx, sy, sz);
  const mesh = new THREE.Mesh(geom, material(p.m, p.c, p.t));
  const c = p.cf; const mtx = new THREE.Matrix4().set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1], c[9], c[10], c[11], c[2], 0, 0, 0, 1);
  mesh.matrixAutoUpdate = false; mesh.matrix.copy(mtx);
  const big = Math.max(sx, sy, sz) > 300;
  mesh.castShadow = p.m !== 'Neon' && p.t < 0.5 && !big; mesh.receiveShadow = true;
  return mesh;
}
for (const p of data.parts) { const m = partMesh(p); if (m) scene.add(m); }

// ---- terrain ----
const tcol = (name) => c3((data.terrainColors && data.terrainColors[name]) || [0.42, 0.5, 0.25]);
let tIndex = 0;
for (const op of data.terrain) {
  if (op.op === 'Clear') continue;
  tIndex++;
  const eps = tIndex * 0.03;
  if (op.mat === 'Water') {
    const c = op.cf; const top = c[1] + op.size[1] / 2;
    const water = new THREE.Mesh(new THREE.PlaneGeometry(op.size[0], op.size[2]), new THREE.MeshStandardMaterial({ color: c3(data.water.c), roughness: 0.15, metalness: 0.2, transparent: true, opacity: 0.88 }));
    water.rotation.x = -Math.PI / 2; water.position.set(c[0], top + eps, c[2]); water.receiveShadow = true; scene.add(water);
    continue;
  }
  const mat = new THREE.MeshStandardMaterial({ color: tcol(op.mat), roughness: 1, map: op.mat === 'Grass' ? grassNoise : null });
  let mesh;
  if (op.op === 'FillCylinder') { mesh = new THREE.Mesh(new THREE.CylinderGeometry(op.radius, op.radius, op.height, 96), mat); const c = op.cf; mesh.position.set(c[0], c[1] + eps, c[2]); }
  else if (op.op === 'FillBlock') { mesh = new THREE.Mesh(new THREE.BoxGeometry(...op.size), mat); const c = op.cf; mesh.matrixAutoUpdate = false; mesh.matrix.set(c[3], c[4], c[5], c[0], c[6], c[7], c[8], c[1] + eps, c[9], c[10], c[11], c[2], 0, 0, 0, 1); }
  else if (op.op === 'FillBall') { mesh = new THREE.Mesh(new THREE.SphereGeometry(op.radius, 40, 24), mat); mesh.position.set(...op.center); }
  if (mesh) { mesh.receiveShadow = true; mesh.castShadow = op.op === 'FillBall'; scene.add(mesh); }
}

// ---- labels (BillboardGui / SurfaceGui text) ----
function labelSprite(text, color, worldH) {
  const lines = text.split('\n'); const fs = 64; const cv = document.createElement('canvas'); const g = cv.getContext('2d');
  g.font = `bold ${fs}px sans-serif`; const w = Math.max(...lines.map(l => g.measureText(l).width)) + 24;
  cv.width = Math.ceil(w); cv.height = lines.length * (fs + 10) + 16;
  g.font = `bold ${fs}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'top'; g.lineJoin = 'round';
  lines.forEach((l, i) => { g.lineWidth = 10; g.strokeStyle = '#040435'; g.strokeText(l, cv.width / 2, 8 + i * (fs + 10)); g.fillStyle = '#' + c3(color).getHexString(); g.fillText(l, cv.width / 2, 8 + i * (fs + 10)); });
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: true, fog: false })); const h = worldH * lines.length; sp.scale.set(h * cv.width / cv.height, h, 1); return sp;
}
for (const l of data.labels) { const sp = labelSprite(l.text, l.c, l.kind === 'BillboardGui' ? 2.2 : 1.6); sp.position.set(...l.p); scene.add(sp); }

// ---- particle emitters (approximate as glowing motes) ----
const moteGeom = new THREE.SphereGeometry(0.22, 6, 4);
for (const e of data.emitters) { const mat = new THREE.MeshBasicMaterial({ color: c3(e.c).multiplyScalar(1.4), toneMapped: false }); for (let i = 0; i < 10; i++) { const m = new THREE.Mesh(moteGeom, mat); m.position.set(e.p[0] + (Math.random() - 0.5) * 4, e.p[1] + Math.random() * 5, e.p[2] + (Math.random() - 0.5) * 4); scene.add(m); } }

// ---- extras injected by views.json (avatars for scale, ambient NPC/car previews) ----
function avatar(pos, yaw, shirt) {
  const g = new THREE.Group(); const skin = new THREE.MeshStandardMaterial({ color: 0xf2c79c, roughness: 0.6 });
  const shirtM = new THREE.MeshStandardMaterial({ color: shirt, roughness: 0.6 }), pants = new THREE.MeshStandardMaterial({ color: 0x2b3a67, roughness: 0.7 });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; g.add(m); };
  add(new THREE.BoxGeometry(2, 2, 1), shirtM, 0, 3, 0); add(new THREE.BoxGeometry(1, 2, 1), pants, -0.5, 1, 0); add(new THREE.BoxGeometry(1, 2, 1), pants, 0.5, 1, 0);
  add(new THREE.BoxGeometry(1, 2, 1), skin, -1.5, 3, 0); add(new THREE.BoxGeometry(1, 2, 1), skin, 1.5, 3, 0); add(new THREE.BoxGeometry(1.2, 1.2, 1.2), skin, 0, 4.6, 0);
  g.position.set(...pos); g.rotation.y = yaw; scene.add(g);
}
for (const a of (views.avatars || [])) avatar(a.pos, a.yaw || 0, a.color || 0xe8483f);

// ---- post: bloom + color correction ----
const camera = new THREE.PerspectiveCamera(70, W / H, 0.5, 3000);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.45, 0.5, 0.92));
const cc = data.cc || { sat: 0, con: 0, bri: 0 };
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, sat: { value: cc.sat }, con: { value: cc.con }, bri: { value: cc.bri } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader: 'uniform sampler2D tDiffuse; uniform float sat,con,bri; varying vec2 vUv; void main(){ vec4 c=texture2D(tDiffuse,vUv); float l=dot(c.rgb,vec3(0.299,0.587,0.114)); c.rgb=mix(vec3(l),c.rgb,1.0+sat); c.rgb=(c.rgb-0.5)*(1.0+con)+0.5+bri; gl_FragColor=c; }',
}));
composer.addPass(new OutputPass());

window.renderView = (name) => {
  const v = views.cameras[name]; if (!v) throw new Error('no view ' + name);
  camera.fov = v.fov || 70; camera.updateProjectionMatrix();
  camera.position.set(...v.pos); camera.lookAt(new THREE.Vector3(...v.look));
  composer.render(); return true;
};
window.viewNames = Object.keys(views.cameras);
window.ready = true;
</script></body></html>
